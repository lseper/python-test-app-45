[project]
name = "python-test-app-45"
version = "0.1.0"
description = "Minimal FastAPI service exposing GET /ping"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    # Starlette >=1.x TestClient deprecates httpx in favour of httpx2 (BSD-3-Clause);
    # with filterwarnings=error the deprecated path fails at import.
    "httpx2>=2",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
